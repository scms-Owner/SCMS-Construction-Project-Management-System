name: Deploy SCMS frontend to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static frontend
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -r assets _site/assets 2>/dev/null || true
          touch _site/.nojekyll
          cat > _site/README-HOSTING.txt <<'EOF'
          GitHub Pages hosts the static frontend only.
          Secure API routes and database operations require a separately hosted backend.
          Never put database credentials or private API secrets in this directory.
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
